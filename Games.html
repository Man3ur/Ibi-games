<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0b1a">
    <link rel="icon" href="assets/img/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    <script>try{document.documentElement.dataset.theme=localStorage.getItem("ibi-theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}catch(e){document.documentElement.dataset.theme="dark"}</script>
    <meta name="description" content="Tous les jeux et applis Ibi Games : PC, mobile, applis et mini-jeux jouables dans le navigateur.">
    <title>Jeux · Ibi Games</title>
</head>

<body data-page="games">

    <main>
        <section class="page-hero container">
            <span class="eyebrow">Catalogue</span>
            <h1>Nos jeux &amp; applis</h1>
            <p>PC, mobile, applis et mini-jeux jouables directement ici. Survole ou touche une carte pour voir où la télécharger.</p>

            <div class="search" role="search">
                <i data-icon="search"></i>
                <label class="sr-only" for="game-search">Rechercher un jeu</label>
                <input id="game-search" type="text" placeholder="Rechercher un jeu…" autocomplete="off"
                    role="combobox" aria-expanded="false" aria-controls="suggestions" aria-autocomplete="list">
                <button class="search-clear" type="button" aria-label="Effacer"><i data-icon="close"></i></button>
                <ul class="autocom-box" id="suggestions" role="listbox"></ul>
            </div>
        </section>

        <section class="container tabs">
            <div class="tab-list" role="tablist" aria-label="Catégories"></div>
            <div class="tab-panels"></div>
        </section>
    </main>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/games-data.js"></script>
    <script src="assets/js/games.js"></script>
</body>

</html>
