<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0b1a">
    <link rel="icon" href="assets/img/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    <script>try{document.documentElement.dataset.theme=localStorage.getItem("ibi-theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}catch(e){document.documentElement.dataset.theme="dark"}</script>
    <link rel="stylesheet" href="assets/css/game.css">
    <meta name="description" content="The Alien Fly, le mini-jeu caché d'Ibi Games.">
    <title>The Alien Fly · Ibi Games</title>
</head>

<body class="game-page">
    <div class="game-bar">
        <a class="btn btn--small" href="Games.html#arcade">← Retour</a>
        <span class="game-title">The Alien Fly</span>
    </div>

    <div class="fly-stage">
        <div class="fly-frame">
            <div class="fly-scores">
                <span id="bestScore">Record : 0</span>
                <span id="currentScore">Score : 0</span>
            </div>
            <canvas id="canvas" width="431" height="768" aria-label="Zone de jeu : clique, touche l'écran ou appuie sur Espace pour voler"></canvas>
        </div>
    </div>

    <script src="the-red-one-flies/script.js"></script>
</body>

</html>
