<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page introuvable · Ibi Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- Styles intégrés : cette page peut s'afficher à n'importe quelle adresse -->
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            text-align: center;
            font-family: "Outfit", system-ui, sans-serif;
            color: #f2f1ff;
            background:
                radial-gradient(60% 50% at 80% 0%, rgba(255, 138, 31, .16), transparent 70%),
                radial-gradient(50% 40% at 0% 100%, rgba(120, 90, 255, .18), transparent 70%),
                #0b0b1a;
        }

        .title {
            position: relative;
            font-family: "Press Start 2P", monospace;
            font-size: clamp(4rem, 18vw, 9rem);
            line-height: 1;
        }

        /* Effet « glitch » */
        .title::before,
        .title::after {
            content: attr(data-content);
            position: absolute;
            inset: 0;
            background: #0b0b1a;
            overflow: hidden;
        }

        .title::before {
            left: 3px;
            text-shadow: -3px 0 #ff4d6d;
            animation: glitch 2.5s infinite linear alternate-reverse;
        }

        .title::after {
            left: -3px;
            text-shadow: 3px 0 #3edfff;
            animation: glitch 3s infinite linear alternate-reverse;
        }

        @keyframes glitch {
            0% { clip-path: inset(10% 0 80% 0); }
            20% { clip-path: inset(60% 0 20% 0); }
            40% { clip-path: inset(30% 0 50% 0); }
            60% { clip-path: inset(80% 0 5% 0); }
            80% { clip-path: inset(5% 0 70% 0); }
            100% { clip-path: inset(45% 0 35% 0); }
        }

        p {
            margin: 28px 0 32px;
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            font-weight: 600;
            color: #a9a7cc;
        }

        a {
            display: inline-block;
            padding: 14px 26px;
            border-radius: 999px;
            font-weight: 700;
            color: #1a0f00;
            text-decoration: none;
            background: linear-gradient(135deg, #ff8a1f, #ffd23f);
            transition: transform .2s;
        }

        a:hover { transform: translateY(-2px); }

        @media (prefers-reduced-motion: reduce) {
            .title::before, .title::after { animation: none; display: none; }
        }
    </style>
</head>

<body>
    <main>
        <div class="title" data-content="404">404</div>
        <p>Oups, cette page n'existe pas (ou plus).</p>
        <a id="home" href="/">Retour à l'accueil</a>
    </main>

    <script>
        // Sur GitHub Pages (site de projet), l'accueil est dans un sous-dossier.
        if (location.hostname.endsWith("github.io")) {
            const repo = location.pathname.split("/")[1];
            if (repo) document.getElementById("home").href = "/" + repo + "/";
        }
    </script>
</body>

</html>
