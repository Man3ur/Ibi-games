<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0b1a">
    <link rel="icon" href="assets/img/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    <script>try{document.documentElement.dataset.theme=localStorage.getItem("ibi-theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}catch(e){document.documentElement.dataset.theme="dark"}</script>
    <meta name="description" content="Les vidéos Ibi Games : gameplays, démos et coulisses.">
    <title>Vidéos · Ibi Games</title>
</head>

<body data-page="videos">

    <div id="preloader"><div class="loader-dots"><span></span><span></span><span></span></div></div>

    <main>
        <section class="page-hero container">
            <span class="eyebrow">YouTube</span>
            <h1>Vidéos</h1>
            <p>Gameplays, démos et coulisses. Abonne-toi à la chaîne pour ne rien rater.</p>
            <p style="margin-top:22px"><a class="btn btn--primary" href="https://www.youtube.com/channel/UCZjLqhss2igD9YZu-V-xcXg" target="_blank" rel="noopener"><i data-icon="youtube"></i>S'abonner à la chaîne</a></p>
        </section>

        <section class="container video-grid">
            <!-- Pour ajouter une vidéo : copie une ligne et remplace data-id par l'identifiant YouTube -->
            <div class="video reveal" data-id="AnT-uiOojKc" data-title="Vidéo 4"></div>
            <div class="video reveal" data-id="XTTG7_iqX9c" data-title="Vidéo 3"></div>
            <div class="video reveal" data-id="Qn2VCCrskxM" data-title="Vidéo 2"></div>
            <div class="video reveal" data-id="va0aezu2Kys" data-title="Vidéo 1"></div>
        </section>
    </main>

    <script src="assets/js/main.js"></script>
</body>

</html>
