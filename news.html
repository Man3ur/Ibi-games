<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0b1a">
    <link rel="icon" href="assets/img/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    <script>try{document.documentElement.dataset.theme=localStorage.getItem("ibi-theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}catch(e){document.documentElement.dataset.theme="dark"}</script>
    <meta name="description" content="Les actualités du studio Ibidium et d'Ibi Games.">
    <title>Actus · Ibi Games</title>
</head>

<body data-page="news">

    <div id="preloader"><div class="loader-dots"><span></span><span></span><span></span></div></div>

    <main>
        <section class="page-hero container">
            <span class="eyebrow">Journal de bord</span>
            <h1>Actus</h1>
            <p>Les nouveautés du studio, les sorties et les coulisses.</p>
        </section>

        <section class="container">
            <div class="timeline">
                <!-- Pour ajouter une actu : copie un bloc <article> et place-le en haut -->
                <article class="panel post reveal">
                    <time datetime="2022-03-26">26 mars 2022</time>
                    <h2>Le lancement des sites</h2>
                    <p>Aujourd'hui est un grand jour : c'est le lancement officiel d'Ibidium. Les deux sites sont terminés. Un grand merci à toute l'équipe !</p>
                </article>
            </div>
        </section>
    </main>

    <script src="assets/js/main.js"></script>
</body>

</html>
