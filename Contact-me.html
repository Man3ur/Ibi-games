<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0b1a">
    <link rel="icon" href="assets/img/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    <script>try{document.documentElement.dataset.theme=localStorage.getItem("ibi-theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}catch(e){document.documentElement.dataset.theme="dark"}</script>
    <meta name="description" content="Contacter le studio Ibidium par e-mail ou sur Discord.">
    <title>Contact · Ibi Games</title>
</head>

<body data-page="contact">

    <main>
        <section class="page-hero container">
            <span class="eyebrow">Contact</span>
            <h1>Une question ? Écris-nous</h1>
            <p>Suggestion, bug, partenariat ou simple message : on répond en français et en anglais.</p>
        </section>

        <section class="container">
            <div class="panel contact-card reveal">
                <i data-icon="mail" style="width:44px;height:44px;margin:0 auto;color:var(--accent)"></i>
                <p class="muted" style="margin-top:12px">Par e-mail</p>
                <a class="mail link" href="mailto:ibidium.official.contact@gmail.com">ibidium.official.contact@gmail.com</a>
                <div class="contact-actions">
                    <a class="btn btn--primary" href="mailto:ibidium.official.contact@gmail.com"><i data-icon="mail"></i>Envoyer un e-mail</a>
                    <button class="btn" type="button" id="copy-mail"><i data-icon="copy"></i><span>Copier l'adresse</span></button>
                </div>

                <div class="contact-socials">
                    <a href="https://discord.com/invite/AKcMAGmQmr" target="_blank" rel="noopener" style="color:#7b8cff"><i data-icon="discord"></i>Discord</a>
                    <a href="https://www.youtube.com/channel/UCZjLqhss2igD9YZu-V-xcXg" target="_blank" rel="noopener" style="color:#ff3b3b"><i data-icon="youtube"></i>YouTube</a>
                    <a href="https://www.paypal.com/paypalme/aimbotyt" target="_blank" rel="noopener" style="color:#2ea7ff"><i data-icon="paypal"></i>Nous soutenir</a>
                </div>
            </div>
        </section>
    </main>

    <script src="assets/js/main.js"></script>
    <script>
        document.getElementById("copy-mail").addEventListener("click", async (e) => {
            const btn = e.currentTarget;
            const label = btn.querySelector("span");
            try {
                await navigator.clipboard.writeText(SITE.email);
                label.textContent = "Adresse copiée !";
            } catch (err) {
                label.textContent = SITE.email;
            }
            setTimeout(() => (label.textContent = "Copier l'adresse"), 2500);
        });
    </script>
</body>

</html>
